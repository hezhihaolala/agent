[project]
name = "guiyuan-family-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.19.1",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "openai==3.8.0",
  "psycopg[binary]==3.3.5",
  "pydantic-settings==2.15.0",
  "pwdlib[argon2]==0.3.1",
  "python-multipart==0.0.32",
  "sqlalchemy==2.0.52",
  "uvicorn==0.52.4",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "PyYAML==6.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
